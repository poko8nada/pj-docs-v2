name: PR Agent Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # mainのTomlを変更せず、モデル順とレビュー形式をWorkflowで検証する
      - name: Run PR Agent
        id: pragent
        uses: docker://pragent/pr-agent@sha256:3121a7b8e3ab497b4df09dea6a444da8f01a474496c8c2f722828512c52fd266
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG__MODEL: 'openrouter/openai/gpt-oss-120b'
          CONFIG__FALLBACK_MODELS: '["openrouter/qwen/qwen3-coder-30b-a3b-instruct", "openrouter/qwen/qwen3-235b-a22b-2507", "openrouter/mistralai/mistral-small-3.2-24b-instruct", "openrouter/openai/gpt-5.6-luna"]'
          CONFIG__AI_TIMEOUT: '60'
          CONFIG__MAX_MODEL_TOKENS: '32000'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '32000'
          CONFIG__REASONING_EFFORT: 'low'
          OPENROUTER__REASONING_EFFORT: 'low'
          CONFIG__RESPONSE_LANGUAGE: 'ja-JP'
          CONFIG__PUBLISH_OUTPUT_PROGRESS: 'false'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          PR_REVIEWER__PERSISTENT_COMMENT: 'false'
          PR_REVIEWER__FINAL_UPDATE_MESSAGE: 'false'
          PR_REVIEWER__ENABLE_INTRO_TEXT: 'false'
          PR_REVIEWER__ENABLE_HELP_TEXT: 'false'
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: 'true'
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: 'true'
          PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: 'false'
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: 'false'
          PR_REVIEWER__REQUIRE_CAN_BE_SPLIT_REVIEW: 'false'
          PR_REVIEWER__REQUIRE_ESTIMATE_CONTRIBUTION_TIME_COST: 'false'
          PR_REVIEWER__NUM_MAX_FINDINGS: '3'
          PR_REVIEWER__EXTRA_INSTRUCTIONS: |
            必ず日本語で回答してください。
            標準のHTML表形式の導入文、推定工数、一般的なレビューガイドは出力しないでください。
            次のMarkdown形式で簡潔に出力してください。

            ## 結論
            要対応、または指摘なし

            ## 指摘
            各指摘は次の形式にしてください。
            ### [P1/P2/P3] 問題の短いタイトル
            - 場所: `path:line`
            - 問題:
            - 根拠:
            - 修正案:

            指摘がない場合は、## 指摘の下に「指摘なし」とだけ書いてください。
            推測や好みではなく、今回の変更による具体的な問題だけを指摘してください。
