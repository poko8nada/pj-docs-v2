<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundation</title>
  </head>
  <body class="min-h-screen bg-neutral-50 text-neutral-900 flex flex-col">
    <!--
    見本の landmark。各要素に data-aid="<id>" を振るとコメントと紐づく。
    FAB・ドロワー・補助線は annotate.js が body に生成する（dev のみ）。HTML には載せない。
  -->
    <header
      data-aid="header"
      class="flex items-center justify-between px-6 py-4 border-b border-neutral-200 bg-white"
    >
      <span class="font-semibold tracking-tight" data-aid="brand">Brand</span>
      <nav class="flex gap-4 text-sm text-neutral-600" data-aid="nav">
        <a href="#" data-aid="nav-top">Top</a>
        <a href="#" data-aid="nav-about">About</a>
        <a href="#" data-aid="nav-contact">Contact</a>
      </nav>
    </header>

    <main class="flex-1 p-8 space-y-6 max-w-3xl mx-auto w-full" data-aid="main">
      <h1 class="text-2xl font-semibold" data-aid="title">Foundation</h1>
      <p class="text-neutral-600" data-aid="intro">
        ここにイメージ・ヒーロー構図・タイポ試行を並べる。要素をクリックすると浮遊ボタンからコメントパネルが開く。
        要素をホバーすると補助線と aid が表示される（dev tool風）。
      </p>
      <div class="grid grid-cols-2 gap-4" data-aid="grid">
        <div
          class="aspect-4/3 bg-neutral-200 rounded flex items-center justify-center text-neutral-400"
          data-aid="img-1"
        >
          img-1
        </div>
        <div
          class="aspect-4/3 bg-neutral-200 rounded flex items-center justify-center text-neutral-400"
          data-aid="img-2"
        >
          img-2
        </div>
      </div>
    </main>

    <footer
      data-aid="footer"
      class="px-6 py-4 border-t border-neutral-200 text-xs text-neutral-500 bg-white"
    >
      <span data-aid="copyright">© 2026 Brand. All rights reserved.</span>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
