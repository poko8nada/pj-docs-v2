pre-commit:
  jobs:
    - name: cleanup-uo
      run: |
        files=$(grep -rEln 'UO\[[0-9]+\]\[done\]' . --exclude-dir={node_modules,.git,dist})
        if [ -n "$files" ]; then
          echo "$files" | xargs sed -E -i '' '/UO\[[0-9]+\]\[done\]/d'
          echo "$files" | xargs sed -E -i '' '/^$/N;/^\n$/d'
          echo "☑︎ Removed [done] UO comments from: $files"
          git add $files
        fi
    - name: checks
      group:
        parallel: true
        jobs:
          - name: format
            glob: '*.{js,jsx,ts,tsx}'
            run: pnpm format {staged_files}
            stage_fixed: true
            fail_text: 'Format auto-fixed. Re-stage and re-commit if needed (stage_fixed usually handles this).'
          - name: lint
            glob: '*.{js,jsx,ts,tsx}'
            run: pnpm lint {staged_files}
            fail_text: 'Lint failed. Run: pnpm lint:fix for details. Fix the code, not the config.'
          - name: typecheck
            glob: '*.{js,jsx,ts,tsx}'
            run: pnpm typecheck:staged {staged_files}
            fail_text: 'Type check failed. Run: pnpm typecheck:staged for details.'

pre-push:
  commands:
    check-uo:
      run: |
        if grep -rEn 'UO\[[0-9]+\]:' . --exclude-dir={node_modules,.git,dist} > /dev/null 2>&1; then
          echo "× UO comments found:"
          grep -rEn 'UO\[[0-9]+\]:' . --exclude-dir={node_modules,.git,dist}
          exit 1
        fi
      fail_text: 'All UO comments must be resolved before pushing.'
    typecheck:
      run: pnpm typecheck
      fail_text: 'Type check failed. Run: pnpm typecheck for details.'
